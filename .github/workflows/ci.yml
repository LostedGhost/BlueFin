name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  backend:
    name: Backend — vérifications
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - run: composer install --no-progress --prefer-dist

      - name: Vérifier la syntaxe PHP de tous les fichiers
        run: find app database routes -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Copier la config de test et lancer les migrations (SQLite)
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # .env.example vise la production : DB_DATABASE y est vide (MySQL) et
          # la session/le cache passent par la base. En test il faut un chemin
          # SQLite explicite, et ni session ni cache en base — sinon toute page
          # web répond 500, la base de test étant vide.
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|" .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$GITHUB_WORKSPACE/backend/database/database.sqlite|" .env
          sed -i "s|^SESSION_DRIVER=.*|SESSION_DRIVER=array|" .env
          sed -i "s|^CACHE_STORE=.*|CACHE_STORE=array|" .env
          sed -i "s|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|" .env
          touch database/database.sqlite
          php artisan migrate --force

      - name: Lancer la suite de tests
        run: php artisan test
