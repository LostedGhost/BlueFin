name: Deploy backend (Hostinger)

# Déploie le code du backend sur Hostinger, une fois le workflow « CI » passé
# au vert sur main. Déclenchable aussi à la main (onglet Actions > Run workflow).
#
# CE WORKFLOW NE LANCE JAMAIS DE MIGRATION.
# La base de production a été construite en dehors des migrations : plusieurs
# migrations anciennes y sont « en attente » et échoueraient, en laissant
# éventuellement la base à moitié modifiée. Les migrations se lancent donc à la
# main, une par une, avec --path :
#   php artisan migrate --pretend --path=database/migrations/<fichier>.php
#   php artisan migrate --force   --path=database/migrations/<fichier>.php
# En fin de déploiement, le workflow se contente de LISTER les migrations en
# attente pour qu'elles ne soient pas oubliées.
#
# Secrets requis (Settings > Secrets and variables > Actions) :
#   HOSTINGER_SSH_HOST       — hôte SSH (ex: 123.45.67.89)
#   HOSTINGER_SSH_PORT       — port SSH (65002 chez Hostinger, pas 22)
#   HOSTINGER_SSH_USERNAME   — utilisateur SSH hPanel (ex: u381086576)
#   HOSTINGER_SSH_PASSWORD   — mot de passe SSH du compte hPanel
#
# NOTE SÉCURITÉ — le mot de passe SSH donne un accès complet au compte
# d'hébergement (fichiers, .env de production, et donc la base). Toute personne
# ayant le droit d'écriture sur ce dépôt peut le récupérer via un workflow.
# Utiliser donc un mot de passe SSH dédié, différent du compte hPanel, et
# revenir à une clé SSH dès que possible (HOSTINGER_SSH_KEY + authorized_keys) :
# une clé se révoque en supprimant une ligne sur le serveur.
#   HOSTINGER_DEPLOY_PATH    — chemin du projet Laravel sur le serveur, ex:
#                              /home/u381086576/domains/bluefin-immo.com/bluefin-monorepo/backend
#
# Le dossier de déploiement est un clone git du dépôt. Après le changement de
# propriétaire, son remote doit pointer sur la nouvelle adresse :
#   git remote set-url origin https://github.com/SOLDIGIT-BENIN/BlueFin.git

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer sur Hostinger
    runs-on: ubuntu-latest
    environment: production
    # Un déclenchement manuel passe toujours ; un déclenchement automatique
    # seulement si le CI est vert.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Un secret absent arrive comme une chaîne vide, et l'erreur qui suit est
      # obscure (« can't connect without a private SSH key or password »). On
      # dit donc tout de suite lequel manque. Aucune valeur n'est affichée.
      - name: Vérifier que les secrets sont renseignés
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          manquants=0
          verifier() { # $1 = nom du secret, $2 = sa valeur
            if [ -z "$2" ]; then
              echo "MANQUANT : $1"; manquants=1
            else
              echo "OK : $1 (${#2} caractères)"
            fi
          }
          verifier HOSTINGER_SSH_HOST "$HOST"
          verifier HOSTINGER_SSH_PORT "$PORT"
          verifier HOSTINGER_SSH_USERNAME "$USERNAME"
          verifier HOSTINGER_DEPLOY_PATH "$DEPLOY_PATH"
          if [ -z "$PASSWORD" ]; then
            echo "MANQUANT : HOSTINGER_SSH_PASSWORD"; manquants=1
          else
            echo "OK : HOSTINGER_SSH_PASSWORD (renseigné)"
          fi
          if [ "$manquants" -ne 0 ]; then
            echo ""
            echo "Créer les secrets manquants dans Settings > Secrets and variables > Actions"
            echo "(onglet Actions, pas Dependabot ni Codespaces), avec le nom exact ci-dessus."
            exit 1
          fi

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.HOSTINGER_DEPLOY_PATH }}"

            # --ff-only : on refuse de déployer si le serveur a des commits
            # locaux, plutôt que de créer une fusion silencieuse.
            git pull --ff-only origin main
            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            php artisan queue:restart

            echo "----- Migrations en attente (À LANCER À LA MAIN, avec --path) -----"
            php artisan migrate:status | grep -i "pending" || echo "Aucune : la base est à jour."
