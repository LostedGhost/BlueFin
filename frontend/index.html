
    <!DOCTYPE html>
    <html lang="fr">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!--
          Titre/description/OG/canonical : gérés exclusivement par react-helmet-async
          (voir src/app/components/Seo.tsx et le <Seo default /> rendu par AppContent).
          Ne pas ajouter de balises meta:description/og:*/canonical statiques ici — elles
          ne seraient jamais retirées par Helmet et resteraient dupliquées à côté des
          bonnes valeurs, ce qui a déjà causé un bug (voir audit SEO / plan-correction-totale.md).
        -->
        <title>Bluefin Immo</title>
        <meta name="geo.region" content="BJ" />
        <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
        <!--
          Plus Jakarta Sans est déjà déclarée comme police de l'app dans
          src/styles/theme.css, mais n'était jamais chargée nulle part — le
          site retombait silencieusement sur la police système (Segoe UI/San
          Francisco), ce qui contribue fortement à l'aspect générique.
        -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
        />

        <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      </head>

      <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
      </body>
    </html>
